name: Build and release

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS universal app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Build app and ZIP
        run: ./scripts/build-app.sh
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ChainYourMac-macOS-universal
          path: dist/ChainYourMac-macOS-universal.zip
          if-no-files-found: error

  windows:
    name: Build Windows x64 app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained app and ZIP
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ChainYourMac-Windows-x64
          path: dist/ChainYourMac-Windows-x64.zip
          if-no-files-found: error

  release:
    name: Attach packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum ChainYourMac-macOS-universal.zip ChainYourMac-Windows-x64.zip > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" \
            ChainYourMac-macOS-universal.zip \
            ChainYourMac-Windows-x64.zip \
            SHA256SUMS.txt \
            --title "ChainYourMac $RELEASE_TAG" \
            --generate-notes
